<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThienPhucDental | {EMAIL_TITLE}</title>
    <!--[if !mso]><!-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!--<![endif]-->
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            background-color: #EEF2F6;
        }

        table, td {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
        }

        @media only screen and (max-width: 620px) {
            .container-table {
                width: 100% !important;
                border-radius: 0px !important;
            }

            .header-cell {
                padding: 18px 16px !important;
            }

            .badge-cell {
                display: none !important; /* Tự ẩn badge phụ trên mobile để không chật chữ */
            }

            .brand-title {
                font-size: 18px !important;
                letter-spacing: 0.5px !important;
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #EEF2F6;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#EEF2F6">
        <tr>
            <td align="center" style="padding: 30px 12px 40px 12px;">

                <!--[if (gte mso 9)|(IE)]>
                <table align="center" border="0" cellspacing="0" cellpadding="0" width="600">
                <tr>
                <td align="center" valign="top" width="600">
                <![endif]-->

                <table class="container-table" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08); border: 1px solid #E2E8F0;">

                    <!-- Dải viền vàng Champagne trên cùng -->
                    <tr>
                        <td height="4" style="background-color: #C5A880; font-size: 1px; line-height: 1px;">&nbsp;</td>
                    </tr>

                    <!-- FULL HEADER BAR: Tận dụng toàn bộ chiều ngang -->
                    <tr>
                        <td class="header-cell" bgcolor="#FCFCFD" style="padding: 22px 32px; border-bottom: 1px solid #EAEFF5; background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <!-- Khối Thương Hiệu Lớn Bên Trái -->
                                    <td align="left" valign="middle">
                                        <table border="0" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <!-- Logo Tăng Kích Thước Rõ Nét -->
                                                <td valign="middle" style="padding-right: 16px;">
                                                    <img src="{EMAIL_LOGO_URL}" alt="ThienPhucDental" width="68" height="68" style="display: block; width: 68px; height: 68px; border-radius: 50%; border: 2px solid #E8DCBE; object-fit: cover; box-shadow: 0 3px 8px rgba(0,0,0,0.06);">
                                                </td>
                                                <!-- Vạch phân cách kim loại -->
                                                <td valign="middle" style="padding-right: 16px;">
                                                    <table border="0" cellpadding="0" cellspacing="0">
                                                        <tr>
                                                            <td width="1" height="46" bgcolor="#D6C4AE" style="font-size: 1px; line-height: 1px;">&nbsp;</td>
                                                        </tr>
                                                    </table>
                                                </td>
                                                <!-- Tên & Tagline To Đậm Bắt Mắt -->
                                                <td valign="middle" align="left">
                                                    <div class="brand-title" style="font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 21px; font-weight: 800; color: #0F172A; letter-spacing: 1.2px; text-transform: uppercase; line-height: 25px;">
                                                        THIÊN PHÚC DENTAL
                                                    </div>
                                                    <div style="font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 12px; font-weight: 600; color: #A27B4D; letter-spacing: 2px; text-transform: uppercase; line-height: 16px; padding-top: 3px;">
                                                        NHA KHOA KỸ THUẬT CAO
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <!-- Khối Điểm Nhấn Luxury Bên Phải (Lấp đầy khoảng trống) -->
                                    <td class="badge-cell" align="right" valign="middle">
                                        <table border="0" cellpadding="0" cellspacing="0" style="border: 1px solid #E5D5BC; border-radius: 30px; background-color: #FAF6EE;">
                                            <tr>
                                                <td style="padding: 7px 15px; font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 11px; font-weight: 700; color: #8C6635; letter-spacing: 1.2px; text-transform: uppercase; white-space: nowrap;">
                                                    HỆ THỐNG NỘI BỘ
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Khung Nội Dung Email (Tràn mép, khớp với banner bên trong) -->
                    <tr>
                        <td align="center" style="padding: 0;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="left" style="font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 15px; line-height: 26px; color: #334155;">
                                        {EMAIL_BODY}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td bgcolor="#F8FAFC" align="center" style="padding: 24px 24px; border-top: 1px solid #E2E8F0;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center" style="font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 12px; line-height: 20px; color: #64748B;">
                                        <span style="font-weight: 600; color: #1E293B;">ThienPhucDental Clinic</span> &bull; Nâng tầm chất lượng nụ cười
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-top: 4px; font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 12px; line-height: 18px; color: #94A3B8;">
                                        &copy; {THIS_YEAR} ThienPhucDental. All rights reserved.
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>

                <!--[if (gte mso 9)|(IE)]>
                </td>
                </tr>
                </table>
                <![endif]-->

            </td>
        </tr>
    </table>
</body>
</html>
